name: Agent PR gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application:
    name: Application tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.13'
      - run: uv sync --locked
      - name: Verify application
        run: uv run --frozen python -m unittest discover -s tests -p test_shipping.py -q
  maida:
    name: Maida behavioral gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.13'
      - run: uv sync --directory candidate --locked
      - name: Require review for gate configuration changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        working-directory: candidate
        run: |
          git fetch origin "$BASE_SHA" "$HEAD_SHA"
          if ! git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- .maida .github/workflows github_gate.py; then
            echo "::error::Gate configuration changed. Review and accept separately before running scenario PRs."
            exit 1
          fi
      - name: Evaluate current agent instructions
        working-directory: candidate
        run: uv run --frozen python github_gate.py --trusted-root ../trusted
